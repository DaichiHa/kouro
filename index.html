<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>港の依頼</title>
<style>
:root{--bg:#f6efe0;--card:#fffdf7;--ink:#243746;--sub:#6b5638;--line:#d9c9a3;--gold:#9a6f06;--red:#9c3a2a;--on:#2d4a5c;--onink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#15191c;--card:#1f2529;--ink:#e8e2d4;--sub:#b9a98a;--line:#3a4247;--gold:#e0b64a;--red:#e07a66;--on:#e0b64a;--onink:#15191c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Hiragino Mincho ProN","Yu Mincho",serif;padding:12px 12px 110px}
h1{font-size:20px;text-align:center;margin:4px 0}.k{text-align:center;font-size:11px;letter-spacing:4px;color:var(--sub)}
.st{border:2px solid var(--ink);border-radius:10px;padding:8px 12px;margin:10px 0;font-size:13px}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}
.c.star{border:2px solid var(--gold)}.h{font-size:12px;color:var(--sub);font-weight:bold;display:flex;justify-content:space-between}
.x{font-size:12px;color:var(--sub);margin:4px 0;border-left:3px solid var(--line);padding-left:8px}
.b{display:inline-block;margin:4px 6px 0 0;padding:10px 14px;border:2px solid var(--ink);border-radius:9px;background:transparent;color:var(--ink);font:bold 15px sans-serif}
.b.on{background:var(--on);color:var(--onink);border-color:var(--on)}

.f{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding:8px 12px}
.f .m{font-size:13px;margin-bottom:6px}.go{display:block;text-align:center;text-decoration:none;padding:13px;border-radius:10px;background:var(--red);color:#fff;font:bold 17px sans-serif}.go.off{background:var(--line);color:var(--sub)}.go.busy{opacity:.6}.go.sent{background:transparent;color:var(--red);border:2px solid var(--red)}.go.lock{pointer-events:none}.lockall .b{pointer-events:none}.a{font:12px monospace;color:var(--sub);margin-top:4px;word-break:break-all}
.w{width:100%;margin-top:6px;padding:8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font-size:15px}.q{font-size:12px;color:var(--gold);font-weight:bold;margin-top:8px}.r.done{opacity:.72}.pop{position:fixed;font:bold 18px sans-serif;color:var(--gold);pointer-events:none;animation:up .9s ease-out forwards}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
</style></head><body>
<div id="qs"></div>
<div class="f"><div class="m" id="m"></div><a class="go off" id="go" href="#">まず1つ選ぶ</a><div class="a" id="a"></div><div class="a" id="fb" hidden>送れない時：<a id="gm" href="#" target="_blank" rel="noopener">Gmail で送る</a>／<a id="mt" href="#">メールアプリで送る</a></div></div>
<script>
const bar=(a,b,w=10)=>{const k=Math.max(0,Math.min(w,Math.round(w*a/Math.max(1,b))));return "■".repeat(k)+"□".repeat(w-k)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function load(){let h=location.hash.slice(1);const raw=h[0]==="r";if(raw)h=h.slice(1);h=h.replace(/-/g,"+").replace(/_/g,"/");h+="===".slice((h.length+3)%4);
 const b=Uint8Array.from(atob(h),c=>c.charCodeAt(0));
 if(raw)return JSON.parse(new TextDecoder().decode(b));
 const s=new Blob([b]).stream().pipeThrough(new DecompressionStream("deflate-raw"));return JSON.parse(await new Response(s).text())}
load().then(D=>{
 const K="kouro-"+D.d+"-"+D.t;let P={},W={},SENT=0;try{P=JSON.parse(localStorage.getItem(K)||"{}");W=JSON.parse(localStorage.getItem(K+"-w")||"{}");SENT=+localStorage.getItem(K+"-sent")||0}catch(e){}
 const [rk,lv,cur,nx,gold,stk,dex,ndex,cat]=D.s;
 const G=[];D.q.forEach(q=>{const g=q[9]||("n"+q[0]),L=G[G.length-1];if(L&&L.g===g)L.q.push(q);else G.push({g,q:[q]})});   // 同じ案は1枚
 document.getElementById("qs").innerHTML=G.map(({q})=>{const f=q[0],star=q.some(x=>x[2]);return `<div class="c${star?" star":""}">
  <div class="h"><span>【${String(f[0]).padStart(2,"0")}】${star?"★":""}${esc(f[1])}</span><span style="color:var(--gold)">+${q.reduce((a,x)=>a+x[6],0)}XP</span></div>
  <div>${esc(f[3])}</div>`+q.map(([n,k,st,t,cx,op,xp,inp,sub,g,w])=>`<div id="c${n}" class="r">${sub?`<div class="q">${esc(sub)}</div>`:""}${cx?`<div class="x">${esc(cx)}</div>`:""}
  ${op.map(([c,l])=>`<button class="b" data-n="${n}" data-c="${esc(c)}" data-xp="${xp}">${esc(l)}</button>`).join("")}${inp?`<input class="w" data-n="${n}" placeholder="社名に入りそうな語（例：指輪,宝石）" value="${esc(W[n]!=null?W[n]:(w||""))}">`:""}</div>`).join("")+`</div>`}).join("");
 document.getElementById("qs").addEventListener("input",e=>{const w=e.target.closest(".w");if(!w)return;W[w.dataset.n]=w.value.replace(/[\s｜~]/g,"");try{localStorage.setItem(K+"-w",JSON.stringify(W))}catch(x){}paint()});
 const paint=()=>{document.querySelectorAll(".b").forEach(b=>b.classList.toggle("on",P[b.dataset.n]===b.dataset.c));
  D.q.forEach(([n])=>document.getElementById("c"+n).classList.toggle("done",!!P[n]));
  const ks=Object.keys(P),xp=D.q.filter(q=>P[q[0]]).reduce((a,q)=>a+q[6],0)+Math.floor(ks.length/5)*100+(ks.length===D.q.length?300:0);
  document.getElementById("m").textContent=`選んだ ${ks.length}/${D.q.length}　見込み +${xp}XP　宝箱 ${Math.floor(ks.length/5)}個${ks.length===D.q.length?"　満載！":""}`;
  const a=Object.keys(P).sort((x,y)=>x-y).map(n=>String(n).padStart(2,"0")+"="+P[n]+(W[n]?"~"+W[n]:"")).join(" "),g=document.getElementById("go");
  document.getElementById("a").textContent=a?"送る中身："+a:"";
  const su=encodeURIComponent("Re: 港の依頼 ｜ KOURO "+D.d+"-"+D.t),bo=encodeURIComponent(a);
  document.getElementById("mt").href="mailto:"+D.to+"?subject="+su+"&body="+bo;
  document.getElementById("gm").href="https://mail.google.com/mail/?view=cm&fs=1&to="+encodeURIComponent(D.to)+"&su="+su+"&body="+bo;
  if(SENT){g.textContent="送りました ✓";g.className="go sent lock";document.body.classList.add("lockall");document.querySelectorAll(".w").forEach(w=>w.disabled=true);return}
  if(a){g.textContent="まとめて送る";g.classList.remove("off")}
  else{g.href="#";g.textContent="まず1つ選ぶ";g.classList.add("off")}
  try{localStorage.setItem(K,JSON.stringify(P))}catch(e){}};
 document.getElementById("qs").addEventListener("click",e=>{const b=e.target.closest(".b");if(!b)return;const n=b.dataset.n;
  const was=P[n];if(was===b.dataset.c)delete P[n];else{P[n]=b.dataset.c;if(!was){const p=document.createElement("div");p.className="pop";p.textContent="+"+b.dataset.xp;
  const r=b.getBoundingClientRect();p.style.left=r.left+"px";p.style.top=r.top+"px";document.body.appendChild(p);setTimeout(()=>p.remove(),900);
  if(Object.keys(P).length%5===0){p.textContent="宝箱！+100"}}}paint()});
 document.getElementById("go").addEventListener("click",async e=>{e.preventDefault();const g=e.currentTarget;
  if(g.classList.contains("off")||g.classList.contains("lock"))return;          // 二度押しを止める
  const a=Object.keys(P).sort((x,y)=>x-y).map(n=>String(n).padStart(2,"0")+"="+P[n]+(W[n]?"~"+W[n]:"")).join(" ");
  g.classList.add("lock","busy");g.textContent="送っています…";
  try{const r=await fetch("https://ntfy.sh/"+D.nt,{method:"POST",body:"KOURO "+D.d+"-"+D.t+"\n"+a});if(!r.ok)throw new Error(r.status);
   SENT=1;try{localStorage.setItem(K+"-sent","1")}catch(x){}g.classList.remove("busy");paint()}
  catch(x){g.classList.remove("lock","busy");g.textContent="送れませんでした（もう一度押す）";document.getElementById("fb").hidden=false}});
 paint();
}).catch(e=>{document.getElementById("qs").textContent="依頼が読めませんでした："+e+"（Chrome か Safari で開き直す）"});
</script></body></html>
